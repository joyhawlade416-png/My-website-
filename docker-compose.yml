version: '3.8'
services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: quickdeal
      MYSQL_USER: wpuser
      MYSQL_PASSWORD: wppass_production
      MYSQL_ROOT_PASSWORD: root_production
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:php8.2-fpm
    restart: always
    depends_on:
      - db
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wpuser
      WORDPRESS_DB_PASSWORD: wppass_production
      WORDPRESS_DB_NAME: quickdeal
    volumes:
      - ./wp:/var/www/html

  nginx:
    image: nginx:stable
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - ./wp:/var/www/html:ro
    depends_on:
      - wordpress

  certbot:
    image: certbot/certbot
    restart: 'no'
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: always
    environment:
      PMA_HOST: db
    ports:
      - '8081:80'
    depends_on:
      - db

volumes:
  db_data:
